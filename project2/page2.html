<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Selection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="container">
        <h1>Character Selection</h1>
      <form id="characterForm" method="get" action="page3.html">
        <fieldset>
            <legend>Choose Your Character</legend>
            <div class="character">
                <input type="radio" id="warrior" name="character" value="warrior">
                <label for="warrior"> <b>Aria, the Warrior:</b> Strong and brave, with the ability to
                overcome physical obstacles. </label>
            </div>
             <div class="character">
                <input type="radio" id="mage" name="character" value="mage">
                <label for="mage"> <b>Eldrin, the Mage:</b> Wise and knowledgeable,
                with the power to solve puzzles and cast spells.</label>
            </div>
             <div class="character">
                <input type="radio" id="rogue" name="character" value="rogue">
                <label for="rogue"><b>Tara, the Rogue:</b> Quick and cunning, 
                    with skills in stealth and persuasion.</label>
            </div>
        </fieldset>
        <input type="submit" value="Continue">
      </form>
    </section>
</body>
</html>
