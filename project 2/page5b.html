<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Path of Stealth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="container">     
<h1>The Path of Stealth</h1>
<p>To successfully navigate the Path of Stealth, you must choose your actions carefully. Select the correct sequence of actions to avoid detection and reach your objective.</p>
<!-- Actions -->
<div onclick="selectAction('hide')" class="stealth-option">Hide in the shadows</div>
<div onclick="selectAction('run')" class="stealth-option">Run quickly to the next cover</div>
<div onclick="selectAction('distract')" class="stealth-option">Create a distraction</div>
<div onclick="selectAction('wait')" class="stealth-option">Wait for the right moment</div>
<!-- Buttons -->
<button onclick="checkSequence()">Check Sequence</button>
<button onclick="reset()">Reset!</button>

<script>
const correctSequence = ['hide', 'wait', 'distract'];
let selectedSequence = [];

function selectAction(action) {
    selectedSequence.push(action);
    const choices = document.querySelectorAll('.stealth-option');
    choices.forEach(function(choice) {
        if (choice.getAttribute('onclick') === "selectAction('" + action + "')") {
            choice.style.backgroundColor = '#562880';
        }
    });
}

function checkSequence() {
    if (selectedSequence.length !== correctSequence.length) {
        alert('Wrong sequence! Try again.');
        reset();
    }
    for (let i = 0; i < correctSequence.length; i++) {
        if (selectedSequence[i] !== correctSequence[i]) {
            alert('Wrong sequence! Try again.');
            reset();
            return;
        }
    }
    alert('Congrats! You have successfully navigated the Path of Stealth!');
    location.href = 'page6.html';
}
function reset() {
    selectedSequence = [];
    const choices = document.querySelectorAll('.stealth-option');
    choices.forEach(function(choice) {
        choice.style.backgroundColor = '#351F37';
    });
}
</script>
    </section>
</body>
</html>
