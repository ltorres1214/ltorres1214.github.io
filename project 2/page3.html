<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Quest Begins</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="container">
      <h1>Pack Your Bag</h1>
<p>Select the supplies you wish to take on your quest. 
    Choose wisely, as you can only carry a limited amount.</p>

    <form method="get" action="page4.html">
        <div class="supplies">
            <input type="checkbox" id="food" name="supplies" value="food">
            <label for="food">Food</label>
        </div>
        <div class="supplies">
            <input type="checkbox" id="water" name="supplies" value="water">
            <label for="water">Water</label>
        </div>
        <div class="supplies">
            <input type="checkbox" id="potions" name="supplies" value="potions">
            <label for="potions">Magic Potions</label>
        </div>
        <div class="supplies">
            <input type="checkbox" id="maps" name="supplies" value="maps">
            <label for="maps">Maps</label>
        </div>
        <div class="supplies">
            <input type="checkbox" id="sword" name="supplies" value="sword">
            <label for="sword">Sword</label>
        </div>
        <input type="submit" value="Continue">
    </form>
    </section>
</body>
</html>
